version: '3.8'

services:
  app:
    image: bwbagaswibowo/contextual-reader:${TAG:-main}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextual-reader-app
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - LLM_ALLOWED_HOSTS=${LLM_ALLOWED_HOSTS}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - SUPPORTED_FORMATS=${SUPPORTED_FORMATS}
      - FILE_UPLOAD_MAX_MEMORY_SIZE=${FILE_UPLOAD_MAX_MEMORY_SIZE}
      - OMNIROUTE_URL=${OMNIROUTE_URL}
      - OMNIROUTE_MODEL=${OMNIROUTE_MODEL}
      - CACHE_DIR=/app/db_data/cache
      - SQLITE_TIMEOUT=${SQLITE_TIMEOUT}
      - LOG_LEVEL=${LOG_LEVEL}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    env_file:
      - .env
    volumes:
      - backend_data:/app/db_data
      - backend_media:/app/media
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/api/core/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1280M
        reservations:
          cpus: '0.75'
          memory: 640M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - reader-net

  cftunnel-reader:
    profiles: ['tunnel']
    image: cloudflare/cloudflared:2024.12.1
    container_name: cftunnel-reader
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN_FILE=/etc/cloudflared/tunnel-token
    volumes:
      - /home/sxz/projects/tokens:/etc/cloudflared:ro
    networks:
      - reader-net

volumes:
  backend_data:
  backend_media:

networks:
  reader-net:
    driver: bridge
