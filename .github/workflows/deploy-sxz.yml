name: Deploy to Server SXZ

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to SXZ
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST || '72.61.215.253' }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER || 'bagas' }}
          SXZ_HOST: ${{ vars.SXZ_HOST || secrets.SXZ_HOST || '100.127.103.9' }}
          SXZ_USER: ${{ vars.SXZ_USER || secrets.SXZ_USER || 'sxz' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Mask host IPs so they never appear in console logs
          if [ -n "$VPS_HOST" ]; then echo "::add-mask::$VPS_HOST"; fi
          if [ -n "$SXZ_HOST" ]; then echo "::add-mask::$SXZ_HOST"; fi

          cat << EOF > ~/.ssh/config
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR

          Host sxz
            HostName $SXZ_HOST
            User $SXZ_USER
            IdentityFile ~/.ssh/deploy_key
            ProxyJump vps
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy on SXZ
        run: |
          ssh -q -o LogLevel=ERROR -o ConnectTimeout=20 sxz << 'EOF'
            set -e
            cd ~/projects/active/contextual-reader
            echo "Pulling latest changes on main..."
            git pull origin main
            echo "Rebuilding and restarting containers..."
            sudo docker compose build || (sleep 5 && sudo docker compose build)
            sudo docker compose up -d
            echo "Waiting for services to initialize..."
            sleep 5
            sudo docker compose ps
          EOF

      - name: Verify health endpoint
        run: |
          ssh -q -o LogLevel=ERROR -o ConnectTimeout=20 sxz << 'EOF'
            set -e
            echo "Checking backend health..."
            curl -f -s http://127.0.0.1:8088/api/core/health/ || exit 1
            echo ""
            echo "Deployment verification successful."
          EOF
