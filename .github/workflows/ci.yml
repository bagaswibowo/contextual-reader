name: CI - Contextual Reader

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contextual
          POSTGRES_PASSWORD: contextual
          POSTGRES_DB: contextual
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: contextual-reader

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd contextual-reader
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install django djangorestframework

      - name: Run migrations
        run: |
          cd contextual-reader
          python manage.py migrate --no-input

      - name: Run backend tests
        run: |
          cd contextual-reader
          python manage.py test reader --keepdb

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: contextual-reader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          cd contextual-reader/frontend
          npm ci

      - name: Build frontend
        run: |
          cd contextual-reader/frontend
          npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: contextual-reader/frontend/dist/
          retention-days: 7

  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: contextual-reader

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          cd contextual-reader
          pip install flake8 pylint

      - name: Lint Python
        run: |
          cd contextual-reader
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint JavaScript
        run: |
          cd contextual-reader/frontend
          npm install eslint eslint-plugin-react eslint-plugin-react-hooks --save-dev
          npx eslint . --ext .js,.jsx --max-warnings 0

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: contextual-reader

      - name: Start services
        run: |
          cd contextual-reader
          docker-compose up -d

      - name: Wait for services
        run: |
          sleep 10
          curl -f http://localhost:8088/api/core/health/ || exit 1

      - name: Run smoke tests
        run: |
          cd contextual-reader
          python smoke.py

      - name: Stop services
        if: always()
        run: |
          cd contextual-reader
          docker-compose down

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, lint, smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          body: |
            Automatic release dari CI
          draft: false
          prerelease: false
