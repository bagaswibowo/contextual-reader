name: CI - Contextual Reader

on:
  push:
    branches: [ main, sprint0/integration ]
  pull_request:
    branches: [ main, sprint0/integration ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: contextual-reader

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd contextual-reader/backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install django djangorestframework

      - name: Run migrations
        env:
          SECRET_KEY: ci-dummy-sprint0
          ALLOWED_HOSTS: localhost
          DEBUG: '0'
        run: |
          cd contextual-reader/backend
          python manage.py migrate --no-input

      - name: Run backend tests
        run: |
          cd contextual-reader/backend
          python manage.py test reader --keepdb

  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: contextual-reader

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python (backend)
        run: |
          cd contextual-reader/backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,node_modules
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,node_modules

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: contextual-reader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contextual-reader/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd contextual-reader/frontend
          npm ci

      - name: Build frontend
        env:
          GENERATE_SOURCEMAP: 'false'
        run: |
          cd contextual-reader/frontend
          npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: contextual-reader/frontend/dist/
          retention-days: 7

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, lint]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: contextual-reader

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Setup Docker Compose
        run: |
          cd contextual-reader
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin

      - name: Start services
        env:
          SECRET_KEY: ci-dummy-sprint0
          ALLOWED_HOSTS: localhost
          CORS_ALLOW_ALL_ORIGINS: 'false'
          CORS_ALLOW_CREDENTIALS: 'false'
          TUNNEL_TOKEN: ci-dummy-sprint0
          LLM_ALLOWED_HOSTS: localhost
        run: |
          cd contextual-reader
          docker compose up -d

      - name: Wait for services
        run: |
          sleep 10
          curl -f http://localhost:8088/api/core/health/ || exit 1

      - name: Run smoke tests
        run: |
          cd contextual-reader
          python smoke.py

      - name: Stop services
        if: always()
        run: |
          cd contextual-reader
          docker compose down -v

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, lint, smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          body: |
            Automatic release dari CI
          draft: false
          prerelease: false
